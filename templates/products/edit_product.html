```html
{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Edit Product</h2>
            <p class="text-muted mb-0">
                Update product information
            </p>
        </div>

        <a href="{% url 'list-products' %}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Back
        </a>
    </div>


    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2 text-muted">Loading product...</p>
    </div>


    <!-- Error -->
    <div id="errorMessage"
         class="alert alert-danger d-none">
    </div>


    <!-- Form -->
    <div id="productFormContainer" class="card shadow-sm d-none">

        <div class="card-body p-4">

            <form id="editProductForm">

                <div class="row">

                    <!-- Product Name -->
                    <div class="col-md-6 mb-3">

                        <label for="name"
                               class="form-label fw-semibold">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter product name"
                            required
                        >

                    </div>


                    <!-- Price -->
                    <div class="col-md-6 mb-3">

                        <label for="price"
                               class="form-label fw-semibold">
                            Price
                        </label>

                        <input
                            type="number"
                            id="price"
                            class="form-control"
                            step="0.01"
                            min="0"
                            placeholder="Enter price"
                            required
                        >

                    </div>


                    <!-- Description -->
                    <div class="col-12 mb-3">

                        <label for="description"
                               class="form-label fw-semibold">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="5"
                            placeholder="Enter product description"
                        ></textarea>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-3">

                    <a href="{% url 'list-products' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        id="saveButton"
                        class="btn btn-primary">

                        <i class="bi bi-check-lg"></i>
                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script>

const productId = "{{ product_id }}";

const apiUrl = `/api/products/${productId}/`;

const form = document.getElementById("editProductForm");

const loading = document.getElementById("loading");

const formContainer =
    document.getElementById("productFormContainer");

const errorMessage =
    document.getElementById("errorMessage");

const saveButton =
    document.getElementById("saveButton");


/*
|--------------------------------------------------------------------------
| GET PRODUCT
|--------------------------------------------------------------------------
*/

async function loadProduct() {

    try {

        const response = await fetch(apiUrl);

        if (!response.ok) {
            throw new Error(
                `Failed to load product (${response.status})`
            );
        }

        const product = await response.json();

        console.log("Product:", product);


        /*
        | Fill form
        */

        document.getElementById("name").value =
            product.name ?? "";

        document.getElementById("price").value =
            product.price ?? "";

        document.getElementById("description").value =
            product.description ?? "";


        /*
        | Show form
        */

        loading.classList.add("d-none");

        formContainer.classList.remove("d-none");

    }

    catch (error) {

        console.error(error);

        loading.classList.add("d-none");

        errorMessage.textContent =
            error.message;

        errorMessage.classList.remove("d-none");

    }

}


/*
|--------------------------------------------------------------------------
| UPDATE PRODUCT
|--------------------------------------------------------------------------
*/

form.addEventListener("submit", async function(event) {

    event.preventDefault();


    saveButton.disabled = true;

    saveButton.innerHTML = `
        <span
            class="spinner-border spinner-border-sm me-1">
        </span>
        Saving...
    `;


    const data = {

        name:
            document.getElementById("name").value,

        price:
            document.getElementById("price").value,

        description:
            document.getElementById("description").value

    };


    try {

        const response = await fetch(
            apiUrl,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        if (!response.ok) {

            const errorData =
                await response.json();

            console.error(errorData);

            throw new Error(
                "Failed to update product."
            );

        }


        /*
        | Success
        */

        alert("Product updated successfully!");

        window.location.href =
            "{% url 'list-products' %}";

    }

    catch (error) {

        console.error(error);

        errorMessage.textContent =
            error.message;

        errorMessage.classList.remove("d-none");

        saveButton.disabled = false;

        saveButton.innerHTML = `
            <i class="bi bi-check-lg"></i>
            Save Changes
        `;

    }

});


/*
|--------------------------------------------------------------------------
| Start
|--------------------------------------------------------------------------
*/

loadProduct();

</script>

{% endblock %}
```
